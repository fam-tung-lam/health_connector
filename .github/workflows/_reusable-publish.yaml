name: Reusable Publish to pub.dev

on:
  workflow_call:
    inputs:
      package-path:
        description: 'Path to the package to publish'
        type: string
        required: true

jobs:
  validate-release-tag:
    name: Validate release tag
    outputs:
      package-name: ${{ steps.release.outputs.package-name }}
      package-version: ${{ steps.release.outputs.package-version }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Match tag to package version
        id: release
        env:
          PACKAGE_PATH: ${{ inputs.package-path }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/validate-release-tag.mjs "$PACKAGE_PATH" "$RELEASE_TAG"

  wait-for-pub-dependencies:
    name: Wait for pub.dev dependencies
    needs: validate-release-tag
    timeout-minutes: 360
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Wait for release dependencies
        env:
          PACKAGE_PATH: ${{ inputs.package-path }}
        run: node scripts/wait-for-pub-dependencies.mjs "$PACKAGE_PATH"

  publish:
    name: Publish to pub.dev
    needs: wait-for-pub-dependencies
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
    with:
      environment: pub.dev
      working-directory: ${{ inputs.package-path }}

  record-pub-deployment:
    name: Record pub.dev deployment
    needs: [validate-release-tag, publish]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: pub.dev / ${{ needs.validate-release-tag.outputs.package-name }}
      url: >-
        https://pub.dev/packages/${{ needs.validate-release-tag.outputs.package-name }}/versions/${{ needs.validate-release-tag.outputs.package-version }}
    steps:
      - name: Record published package version
        env:
          PACKAGE_NAME: ${{ needs.validate-release-tag.outputs.package-name }}
          PACKAGE_VERSION: ${{ needs.validate-release-tag.outputs.package-version }}
        run: echo "$PACKAGE_NAME $PACKAGE_VERSION was published to pub.dev."
