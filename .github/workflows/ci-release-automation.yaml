name: CI - release automation

on:
  pull_request:
    paths:
      - '.github/workflows/cd-health-connector*.yaml'
      - '.github/workflows/_reusable-publish.yaml'
      - '.github/workflows/_reusable-release-validation.yaml'
      - '.github/workflows/ci-release-automation.yaml'
      - 'scripts/release-*.mjs'
      - 'scripts/validate-release-tag.mjs'
      - 'scripts/wait-for-pub-dependencies.mjs'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/cd-health-connector*.yaml'
      - '.github/workflows/_reusable-publish.yaml'
      - '.github/workflows/_reusable-release-validation.yaml'
      - '.github/workflows/ci-release-automation.yaml'
      - 'scripts/release-*.mjs'
      - 'scripts/validate-release-tag.mjs'
      - 'scripts/wait-for-pub-dependencies.mjs'
      - 'package.json'

permissions:
  contents: read

jobs:
  release-version-tests:
    name: Release version tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test release version convention
        run: npm run release:test
