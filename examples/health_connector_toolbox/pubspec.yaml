publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  health_connector: ^3.11.1
  intl: ^0.20.3
  provider: ^6.1.5+1
  shared_preferences: ^2.5.4
  workmanager: ^0.10.10

dev_dependencies:
  fake_async: ^1.3.1
  flutter_test:
    sdk: flutter
  health_connector_lint: ^1.2.2
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
