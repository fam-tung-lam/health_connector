group = "com.phamtunglam.health_connector"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.2.20"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.11.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
// Apply the Kotlin Android plugin only when not using Flutter's built-in Kotlin support.
// Flutter 3.44+ (AGP 9+) provides Kotlin support natively via android.builtInKotlin.
// For earlier Flutter versions, we apply it manually to keep backward compatibility.
// See: https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-plugin-authors#support-flutter-versions-earlier-than-3-44
if (!project.hasProperty("android.builtInKotlin")) {
    apply plugin: "kotlin-android"
}

android {
    namespace = "com.phamtunglam.health_connector"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    // kotlinOptions is only available when the kotlin-android plugin is applied
    // (i.e., when not using Flutter's built-in Kotlin for pre-3.44 compatibility)
    if (!project.hasProperty("android.builtInKotlin")) {
        kotlinOptions {
            jvmTarget = JavaVersion.VERSION_11
        }
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 24
    }

    dependencies {
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
